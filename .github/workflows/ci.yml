name: reliability-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints-tested.txt -e ".[dev,gemini]"
      - run: python -m ruff check commerceguard tests scripts
      - run: python -m pytest -q
      - run: python -m commerceguard demo
      - run: python -m commerceguard evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.os }}-${{ matrix.python }}
          path: results/evaluation.json
