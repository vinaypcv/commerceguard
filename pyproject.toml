[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "commerceguard"
version = "0.1.0"
description = "Evidence-aware agent commerce reliability laboratory"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "z3-solver>=4.13,<5", "mcp>=1.12,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "hypothesis>=6,<7", "ruff>=0.9,<1"]
gemini = ["google-genai>=1,<2"]
[tool.setuptools.packages.find]
include = ["commerceguard*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
